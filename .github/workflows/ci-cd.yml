name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check CI structure
        run: npm run check:ci-structure
      - name: Check dependencies
        run: npm run check:deps
      - name: Lint
        run: npm run lint
      - name: Test business invariants
        run: npm run test:business-invariants

  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"

  domain-sot-smoke:
    needs: quality
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ep
          POSTGRES_PASSWORD: ep
          POSTGRES_DB: ep_local
        ports:
          - 54329:5432
        options: --health-cmd "pg_isready -U ep -d ep_local" --health-interval 3s --health-timeout 5s --health-retries 20
    env:
      EP_LOCAL_AUTH_DRIVER: postgres
      EP_LOCAL_AUTH_DATABASE_URL: postgresql://ep:ep@127.0.0.1:54329/ep_local
      DATABASE_URL: postgresql://ep:ep@127.0.0.1:54329/ep_local
      EP_LOCAL_AUTH_SEED_MODE: dev
      EP_MIGRATE_STRICT: '1'
      # PostgREST HS256 시크릿은 32자 이상 필요
      EP_JWT_SECRET: ep-ci-jwt-secret-change-me-ok32x
      AUTH_API_PORT: '8787'
      EP_AUTH_API_BASE: http://127.0.0.1:8787/api/local-auth
      EP_POSTGREST_URL: http://127.0.0.1:3001
      VITE_SUPABASE_ANON_KEY: ep-anon
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Wait Postgres
        run: npm run db:wait
      - name: Migrate domain (strict)
        run: npm run db:migrate:domain:strict
      - name: Seed local auth
        run: npm run db:seed
      - name: Start PostgREST
        run: |
          docker run -d --name ep-ci-postgrest --network host \
            -e PGRST_DB_URI=postgres://authenticator:ep_authenticator@127.0.0.1:54329/ep_local \
            -e PGRST_DB_SCHEMAS=core,app \
            -e PGRST_DB_ANON_ROLE=app_user \
            -e PGRST_DB_PRE_REQUEST=app.postgrest_pre_request \
            -e PGRST_JWT_SECRET="$EP_JWT_SECRET" \
            -e PGRST_JWT_SECRET_IS_BASE64=false \
            -e PGRST_SERVER_PORT=3001 \
            postgrest/postgrest:v12.2.3
          sleep 3
      - name: Start Auth API
        run: |
          node --import tsx server/local-auth/standalone.ts &
          sleep 2
      - name: Domain SoT smoke
        run: npm run test:domain-smoke

  build-e2e:
    needs: quality
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ep
          POSTGRES_PASSWORD: ep
          POSTGRES_DB: ep_local
        ports:
          - 54329:5432
        options: --health-cmd "pg_isready -U ep -d ep_local" --health-interval 3s --health-timeout 5s --health-retries 20
    env:
      EP_LOCAL_AUTH_DRIVER: postgres
      EP_LOCAL_AUTH_DATABASE_URL: postgresql://ep:ep@127.0.0.1:54329/ep_local
      DATABASE_URL: postgresql://ep:ep@127.0.0.1:54329/ep_local
      EP_LOCAL_AUTH_SEED_MODE: dev
      EP_MIGRATE_STRICT: '1'
      # PostgREST HS256 시크릿은 32자 이상 필요
      EP_JWT_SECRET: ep-ci-jwt-secret-change-me-ok32x
      VITE_LOCAL_AUTH: 'true'
      VITE_CORP_DOMAIN: 'true'
      VITE_SUPABASE_URL: http://127.0.0.1:3001
      VITE_SUPABASE_ANON_KEY: ep-anon
      VITE_AUTH_API_BASE: /api/local-auth
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Wait Postgres
        run: npm run db:wait
      - name: Migrate domain (strict)
        run: npm run db:migrate:domain:strict
      - name: Seed local auth
        run: npm run db:seed
      - name: Start PostgREST
        run: |
          docker run -d --name ep-ci-postgrest-e2e --network host \
            -e PGRST_DB_URI=postgres://authenticator:ep_authenticator@127.0.0.1:54329/ep_local \
            -e PGRST_DB_SCHEMAS=core,app \
            -e PGRST_DB_ANON_ROLE=app_user \
            -e PGRST_DB_PRE_REQUEST=app.postgrest_pre_request \
            -e PGRST_JWT_SECRET="$EP_JWT_SECRET" \
            -e PGRST_JWT_SECRET_IS_BASE64=false \
            -e PGRST_SERVER_PORT=3001 \
            postgrest/postgrest:v12.2.3
          sleep 3
      - name: Build
        run: npm run build
        env:
          VITE_LOCAL_AUTH: 'true'
          VITE_CORP_DOMAIN: 'true'
          VITE_SUPABASE_URL: http://127.0.0.1:3001
          VITE_SUPABASE_ANON_KEY: ep-anon
          VITE_AUTH_API_BASE: /api/local-auth
      - name: Check bundle size
        run: npm run check:bundle-size
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
      - name: Run E2E tests
        run: npm run test:e2e
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-build
          path: dist

  security-db:
    needs: quality
    if: vars.ENABLE_SECURITY_AUDIT == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check secrets
        id: check_secrets
        run: |
          if [ -n "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" ]; then echo "has_secrets=true" >> $GITHUB_OUTPUT; else echo "has_secrets=false" >> $GITHUB_OUTPUT; fi
      - name: Require secrets on main
        if: steps.check_secrets.outputs.has_secrets != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "DB audit secrets missing on main push"
          exit 1
      - name: Run RLS audit
        if: steps.check_secrets.outputs.has_secrets == 'true'
        run: npm run test:rls-audit
      - name: Run booking pass atomic DB test
        if: steps.check_secrets.outputs.has_secrets == 'true'
        run: npm run test:booking-pass-atomic-db
      - name: Run RLS membership escalation audit
        if: steps.check_secrets.outputs.has_secrets == 'true'
        run: npm run test:rls-membership-escalation
      - name: Run auth hijack audit
        if: steps.check_secrets.outputs.has_secrets == 'true'
        run: npm run test:auth-hijack-audit

  deploy:
    needs: [quality, build-e2e, domain-sot-smoke, security-db, codeql]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_CLOUDFLARE_DEPLOY == 'true' && vars.ENABLE_SECURITY_AUDIT == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-build
          path: dist
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ${{ vars.CLOUDFLARE_PROJECT_NAME || 'ep-apps' }}
          directory: dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
