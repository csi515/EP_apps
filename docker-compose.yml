# EP_apps 로컬: Postgres(app/core) + PostgREST + Auth API는 npm run auth:serve
# 사용: npm run db:up && npm run db:wait && npm run db:migrate:domain && npm run db:seed
services:
  postgres:
    image: postgres:16-alpine
    container_name: ep-apps-local-pg
    restart: unless-stopped
    ports:
      - "54329:5432"
    environment:
      POSTGRES_USER: ep
      POSTGRES_PASSWORD: ep
      POSTGRES_DB: ep_local
    volumes:
      - ep_local_pg_data:/var/lib/postgresql/data
      - ./docker/local-auth/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ep -d ep_local"]
      interval: 3s
      timeout: 5s
      retries: 20

  postgrest:
    image: postgrest/postgrest:v12.2.3
    container_name: ep-apps-postgrest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3001:3000"
    environment:
      PGRST_DB_URI: postgres://authenticator:ep_authenticator@postgres:5432/ep_local
      PGRST_DB_SCHEMAS: core,app
      PGRST_DB_ANON_ROLE: app_user
      PGRST_DB_PRE_REQUEST: app.postgrest_pre_request
      PGRST_JWT_SECRET: ${EP_JWT_SECRET:-ep-local-dev-jwt-secret-change-me}
      PGRST_SERVER_PORT: 3000

volumes:
  ep_local_pg_data:
